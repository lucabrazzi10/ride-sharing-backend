jobs:
  # 1. Validate Infrastructure (Terraform)
  infrastructure-lint:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Formatting
        run: terraform fmt -check

      - name: Terraform Init (Offline)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # 2. Validate Deployment Manifests (Helm)
  helm-lint:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Helm
        uses: azure/setup-helm@v4
        
      - name: Lint Helm Chart
        run: helm lint ./helm/rideshare-platform/

  # 3. Build Container Images
  build-services:
    name: Build Microservices
    runs-on: ubuntu-latest
    # A Matrix strategy allows GitHub to build all 5 microservices in parallel
    strategy:
      matrix:
        service: [price-estimator, admin-api, payment-api, admin-ui, payment-ui]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          echo "Building image for ${{ matrix.service }}..."
          docker build -t rideshare/${{ matrix.service }}:${{ github.sha }} ./services/${{ matrix.service }}
          echo "✅ Built successfully. In a live environment, we would now push to AWS ECR."
