version: '3.8'

services:
  rideshare-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: design_pattern_password
      POSTGRES_DB: rideshare_prod
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rideshare_prod"]
      interval: 5s
      timeout: 3s
      retries: 5

  price-estimator-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=rideshare-db
      - DB_NAME=rideshare_prod
      - DB_USER=postgres
      - DB_PASSWORD=design_pattern_password
    depends_on:
      rideshare-db:
        condition: service_healthy
