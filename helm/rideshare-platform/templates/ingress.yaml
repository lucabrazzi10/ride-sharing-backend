apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rideshare-ingress
  annotations:
    kubernetes.io/ingress.class: "alb"
spec:
  rules:
    - http:
        paths:
          {{- range $name, $config := .Values.services }}
          {{- if $config.isPublic }}
          - path: {{ $config.ingressPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}-svc
                port:
                  number: 80
          {{- end }}
          {{- end }}
